spring.application.name=user-authentication
# =============================================
# = Postgres Database Configuration
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/USER
spring.datasource.username=postgres
spring.datasource.password=Mayur@4321
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# = Spring Security (Basic Config)
# =============================================

# If using form login, keep default security. 
# If you want to create your own login APIs:
spring.security.user.name=admin
spring.security.user.password=admin123

# Allowed cross-origin (if using frontend)
# spring.web.cors.allowed-origins=http://localhost:3000

# =============================================
# Logging
# =============================================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

